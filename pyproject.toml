[project]
name = "history"
version = "0.1.0"
description = "HISTORY"
authors = [{ name = "Godin Luc" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click",
]

[project.scripts]
history-postprocess = "history.postprocessing.cli:main"
history-analysis = "history.analysis.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["history"]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 120
