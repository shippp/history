ref_dem_mask = "/path/to/iceland/kh9mc/ref_dem_mask.tif"
landcover = "/path/to/iceland/kh9mc/landcover.tif"

[references_data_mapping.iceland.kh9pc]
ref_dem = "/path/to/iceland/kh9pc/ref_dem.tif"
ref_dem_mask = "/path/to/iceland/kh9pc/ref_dem_mask.tif"
