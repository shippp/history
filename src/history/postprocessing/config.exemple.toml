raw_dir = "/path/to/raw"
extracted_dir = "/path/to/extracted"
proc_dir = "/path/to/processing"
plot_dir = "/path/to/plots"

overwrite = false
overwrite_plots = false
dry_run = false
pdal_exec_path = "pdal"
max_workers = 4
pdf_orientation = "auto"

# Any key under a [references_data_mapping.<site>.<dataset>] section is only read (and
# validated) the first time it's actually requested, so extra/optional keys like
# initial_extrinsics below can be added only where relevant.
[references_data_mapping.casa_grande.aerial]
ref_dem = "/path/to/casa_grande/aerial/ref_dem.tif"
ref_dem_mask = "/path/to/casa_grande/aerial/ref_dem_mask.tif"
landcover = "/path/to/casa_grande/aerial/landcover.tif"
# initial_extrinsics = "/path/to/casa_grande/aerial_images/1978_09_06/camera_model_extrinsics.csv"

[references_data_mapping.casa_grande.kh9mc]
ref_dem = "/path/to/casa_grande/kh9mc/ref_dem.tif"
ref_dem_mask = "/path/to/casa_grande/kh9mc/ref_dem_mask.tif"
landcover = "/path/to/casa_grande/kh9mc/landcover.tif"

[references_data_mapping.casa_grande.kh9pc]
ref_dem = "/path/to/casa_grande/kh9pc/ref_dem.tif"
ref_dem_mask = "/path/to/casa_grande/kh9pc/ref_dem_mask.tif"
landcover = "/path/to/casa_grande/kh9pc/landcover.tif"

[references_data_mapping.iceland.aerial]
